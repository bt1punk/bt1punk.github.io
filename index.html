<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Babylon.js 3D Model</title>
    <style>
        body { margin: 0; }
        canvas { display: block; }
    </style>
</head>
<body>
    <!-- Loading Babylon.js library -->
    <script src="https://cdn.babylonjs.com/babylon.js"></script>
    <script src="https://cdn.babylonjs.com/loaders/babylon.glTF2FileLoader.js"></script>
    <script>
        // Set up the Babylon.js scene
        const canvas = document.createElement('canvas');
        document.body.appendChild(canvas);
        const engine = new BABYLON.Engine(canvas, true);
        const scene = new BABYLON.Scene(engine);

        // Create a camera and position it
        const camera = new BABYLON.ArcRotateCamera("camera", Math.PI / 2, Math.PI / 4, 4, BABYLON.Vector3.Zero(), scene);
        camera.attachControl(canvas, true);

        // Add lighting to the scene
        const light = new BABYLON.HemisphericLight("light", new BABYLON.Vector3(1, 1, 0), scene);

        // Load the 3D model
        BABYLON.SceneLoader.Append("", "model.glb", scene, function (scene) {
            console.log('Model loaded successfully');
            const model = scene.meshes[0];

            // Adjust the model position, scale, or rotation if needed
            model.position.set(0, 0, 0);
            model.scaling.set(1, 1, 1);
            model.rotation.y = Math.PI / 4; // Rotate the model slightly

            // Add simple animation
            const frameRate = 10;
            const xSlide = new BABYLON.Animation("xSlide", "position.x", frameRate, BABYLON.Animation.ANIMATIONTYPE_FLOAT, BABYLON.Animation.ANIMATIONLOOPMODE_CYCLE);

            const keyFrames = []; 
            keyFrames.push({ frame: 0, value: 0 });
            keyFrames.push({ frame: frameRate, value: 1 });
            keyFrames.push({ frame: 2 * frameRate, value: 0 });

            xSlide.setKeys(keyFrames);
            model.animations.push(xSlide);

            scene.beginAnimation(model, 0, 2 * frameRate, true);
        });

        // Render loop
        engine.runRenderLoop(function () {
            scene.render();
        });

        // Handle window resize
        window.addEventListener('resize', function () {
            engine.resize();
        });
    </script>
    <p> test005 </p>
</body>
</html>
